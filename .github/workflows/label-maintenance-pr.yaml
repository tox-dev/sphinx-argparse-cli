name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] This workflow reads PR metadata without checkout or PR code.
    types: [opened, reopened, synchronize]
permissions: {}
concurrency:
  group: label-maintenance-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  label:
    name: Label bot PRs
    runs-on: ubuntu-26.04
    permissions:
      issues: write # Apply or remove the skip news label.
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          fragments: changelog.d,docs/changelog.d
