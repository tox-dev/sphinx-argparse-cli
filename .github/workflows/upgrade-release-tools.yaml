name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@9a4e76e2f4901856f2784f6c0efc89278c518b1f
    permissions:
      actions: write # Trigger the check workflow on the refreshed lock.
      contents: write # Push the lock update branch.
      pull-requests: write # Open or update the lock refresh PR.
    with:
      python-version: "3.15"
      check-workflow: check.yaml
